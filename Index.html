<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente do Murilo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-size: 2.5em;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    main h2 {
      font-size: 1.8em;
      margin-bottom: 15px;
    }

    main p {
      font-size: 1.1em;
      max-width: 600px;
      line-height: 1.6;
    }

    .btn {
      margin-top: 30px;
      background: #fff;
      color: #4a00e0;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #ddd;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Assistente do Murilo</h1>
  </header>

  <main>
    <h2>Olá! Eu sou seu assistente virtual.</h2>
    <p>Estou aqui para ajudar você com tudo o que precisar. Clique no botão abaixo para começar.</p>
    <button class="btn">Começar</button>
  </main>

  <footer>
    &copy; 2025 Assistente do Murilo. Todos os direitos reservados.
  </footer>

</body>
</html>
